# ResNet-34 learning-rate sweep, extension arm lr = 1.0e-2.
#
# The first sweep (1e-4 / 3e-4 / 1e-3) improved monotonically with the rate
# and 1e-3 was both the best arm and the top of the range, so the optimum may
# well lie above it. These two arms push past that edge to find where it turns.
#
# Identical to resnet34_pre_p100_geo_s0.yaml except for run_name and optim.lr
# (SPEC.md 3.13).
run_name: resnet34_pre_p100_geo_lr1e-2_s0
model: resnet34
pretrained: true
data: { root: data_root, subset: p100, mode: offline }
loss: geometric
optim: { lr: 1.0e-2, weight_decay: 1.0e-4, warmup_steps: 500 }
schedule: cosine
total_steps: 6000
batch_size: 128
precision: bf16
eval_every: 500
seed: 0
grad_clip: 1.0
num_workers: 6
