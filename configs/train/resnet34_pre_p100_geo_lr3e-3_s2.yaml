# ResNet-34 seed replicate 2 of the selected setting (lr 3.0e-3).
#
# Identical to resnet34_pre_p100_geo_lr3e-3_s0.yaml except for run_name and
# seed. Three seeds give the run-to-run variance, without which the gap
# between two architectures cannot be told apart from noise (SPEC.md 1.4.1).
run_name: resnet34_pre_p100_geo_lr3e-3_s2
model: resnet34
pretrained: true
data: { root: data_root, subset: p100, mode: offline }
loss: geometric
optim: { lr: 3.0e-3, weight_decay: 1.0e-4, warmup_steps: 500 }
schedule: cosine
total_steps: 6000
batch_size: 128
precision: bf16
eval_every: 500
seed: 2
grad_clip: 1.0
num_workers: 6
