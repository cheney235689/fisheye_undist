# ResNet-34 learning-rate sweep, arm lr = 1.0e-4.
#
# Identical to resnet34_pre_p100_geo_s0.yaml except for run_name and optim.lr,
# so the sweep isolates the learning rate: same data, subset, loss, schedule,
# warmup, weight decay, batch size, step budget and seed (SPEC.md 3.13).
# The 3.0e-4 arm is that base config itself.
run_name: resnet34_pre_p100_geo_lr1e-4_s0
model: resnet34
pretrained: true
data: { root: data_root, subset: p100, mode: offline }
loss: geometric
optim: { lr: 1.0e-4, weight_decay: 1.0e-4, warmup_steps: 500 }
schedule: cosine
total_steps: 6000
batch_size: 128
precision: bf16
eval_every: 500
seed: 0
grad_clip: 1.0
num_workers: 6
